---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: datadog-cluster-agent-netpol
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: datadog-cluster-agent
  ingress:
    - fromEndpoints:
      - matchLabels:
          app: datadog # Node agents talk to cluster agent
      toPorts:
      - ports:
        - port: "5005"
          protocol: TCP
    - fromEndpoints:
      - {} # Webhook/API
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-operator-netpol
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  ingress:
    - fromEndpoints:
      - {} # Kubernetes API talks to it for webhooks
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        - port: "8443"
          protocol: TCP
        - port: "10250"
          protocol: TCP
