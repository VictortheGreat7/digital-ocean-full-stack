  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  ingress:
    - fromEndpoints:
      - matchLabels:
          app.kubernetes.io/name: prometheus # Only scraped by Prometheus
      toPorts:
      - ports:
