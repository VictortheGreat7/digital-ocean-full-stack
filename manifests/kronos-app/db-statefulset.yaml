apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kronos-postgres
  namespace: kronos
spec:
  serviceName: postgres
  replicas: 2
  selector:
    matchLabels:
      app: kronos-app
      component: db
      environment: development
  template:
    metadata:
      labels:
        app: kronos-app
        component: db
        environment: development
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            component: db
      terminationGracePeriodSeconds: 300
      containers:
        - name: postgres
          image: postgres:15-alpine
          args:
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "track_activity_query_size=4096"
            - "-c"
            - "pg_stat_statements.track=ALL"
            - "-c"
            - "track_io_timing=on"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kronos
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U app -d kronos
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/kronos?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: app
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: PG_EXPORTER_LISTEN_ADDR
              value: "0.0.0.0:9187"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 20Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
---
# pdb-postgres.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kronos-postgres-pdb
  namespace: kronos
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kronos-app
      component: db
      environment: development

