architecture: replication

auth:
  enabled: true
  existingSecret: redis-secret
  existingSecretPasswordKey: password
  sentinel: true

master:
  count: 1
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 50m
      memory: 256Mi

replica:
  replicaCount: 3
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 50m
      memory: 256Mi

sentinel:
  enabled: true
  masterSet: foreman
  quorum: 2
  automateClusterRecovery: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true