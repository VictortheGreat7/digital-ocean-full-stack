projects:
  kronos:
    namespace: gitops
    description: Project for Kronos World Clock application
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    additionalAnnotations:
      argocd.argoproj.io/sync-wave: "4"
    sourceRepos:
      - "https://github.com/VictortheGreat7/digital-ocean-full-stack.git"
      - "https://charts.bitnami.com/bitnami"
    destinations:
      - server: https://kubernetes.default.svc
        namespace: kronos
    clusterResourceWhitelist:
    - group: ''
      kind: Namespace
