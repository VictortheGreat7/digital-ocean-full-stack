## ------------------------------------------------------
## Global & Common Configuration
## ------------------------------------------------------
commonLabels:
  app: kronos-app
  environment: development
  component: db

# Deploys 1 Primary and 1 Read Replica (Replacing replicas: 2 in StatefulSet)
architecture: replication

## ------------------------------------------------------
## Authentication & Database Initialization
## ------------------------------------------------------
auth:
  database: "kronos"
  username: "app"
  existingSecret: "postgres-secret"
  secretKeys:
    userPasswordKey: "password"
    # Bitnami requires an admin password key if existingSecret is used.
    # Pointing to the same key assuming the secret has only one, 
    # or you can add a 'postgres-password' key to your K8s secret.
    adminPasswordKey: "password" 
    replicationPasswordKey: "password"

# Translates the `-c shared_preload_libraries=pg_stat_statements` argument
postgresqlSharedPreloadLibraries: "pg_stat_statements"

## ------------------------------------------------------
## Primary Node Configuration
## ------------------------------------------------------
primary:
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

  # Translates the remaining `-c` arguments into the postgresql.conf
  extendedConfiguration: |-
    max_wal_size = 2GB
    track_io_timing=on
    pg_stat_statements.track=ALL
    track_activity_query_size=4096
    checkpoint_completion_target = 0.9

  initdb:
    # Translates the POSTGRES_INITDB_ARGS environment variable
    args: "--data-checksums"
    # Translates the init-script volumeMount and ConfigMap
    scriptsConfigMap: "postgres-init"

  terminationGracePeriodSeconds: 300

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          # Note: Bitnami uses its own component labels for routing
          app.kubernetes.io/name: postgresql

  # Translates livenessProbe timings
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5

  # Translates volumeClaimTemplates
  persistence:
    enabled: true
    storageClass: "do-block-storage"
    size: 20Gi

  # Translates persistentVolumeClaimRetentionPolicy
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenScaled: Delete
    whenDeleted: Delete

  # Translates PodDisruptionBudget 
  # Adjusted to 1 because the Primary is a single pod in this architecture
  pdb:
    create: true
    minAvailable: 1
  
  extraEnvVars:
    - name: POSTGRESQL_AUTH_METHOD
      value: "scram-sha-256"

## ------------------------------------------------------
## Read Replica Configuration
## ------------------------------------------------------
readReplicas:
  replicaCount: 1
  terminationGracePeriodSeconds: 300

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5

  persistence:
    enabled: true
    storageClass: "do-block-storage"
    size: 20Gi

  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenScaled: Delete
    whenDeleted: Delete

  pdb:
    create: true
    minAvailable: 1
  
  extraEnvVars:
    - name: POSTGRESQL_AUTH_METHOD
      value: "scram-sha-256"

## ------------------------------------------------------
## Metrics / Postgres Exporter
## ------------------------------------------------------
metrics:
  # Translates the custom postgres-exporter sidecar container
  # Bitnami automatically wires the exporter to the database internally
  enabled: true

  serviceMonitor:
    # Tells Helm to generate the ServiceMonitor resource
    enabled: true
    
    # Injects the specific label your Prometheus Operator is looking for
    labels:
      release: kube-prom-stack
  
  containerPorts:
    metrics: 9187