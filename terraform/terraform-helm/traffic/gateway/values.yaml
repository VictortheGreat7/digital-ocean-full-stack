gateway:
  className: "cilium"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "${hostname}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "${hostname}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
certManager:
  cluster-issuer: letsencrypt-staging
