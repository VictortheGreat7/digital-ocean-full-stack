gateway:
  className: "cilium"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${domain}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
