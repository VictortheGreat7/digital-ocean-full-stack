kind: CronJob

cronJob:
  schedule: "*/5 * * * *"
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

deschedulerPolicy:
  metricsProviders:
    - source: KubernetesMetrics
  
  profiles:
    - name: RealUsageBalancing
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
        - name: LowNodeUtilization
          args:
            metricsUtilization:
              metricsServer: true
            thresholds:
              cpu: 60
            targetThresholds:
              cpu: 70
      plugins:
        balance:
          enabled:
            - LowNodeUtilization
