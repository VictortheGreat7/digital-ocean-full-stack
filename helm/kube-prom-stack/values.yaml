prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: "60m"
        memory: "500Mi"
      limits:
        cpu: "70m"
        memory: "600Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          resources:
            requests:
              storage: 10Gi
    enableRemoteWriteReceiver: true
    enableFeatures:
      - native-histograms
      - exemplar-storage
    externalUrl: "https://kronos.mywonderworks.tech/monitoring/prometheus/"
    routePrefix: "/"
  route:
    main:
      enabled: true
      parentRefs:
        - name: kronos-gateway
          namespace: kube-system
          sectionName: https
      hostnames:
        - kronos.mywonderworks.tech
      matches:
        - path:
            type: PathPrefix
            value: /monitoring/prometheus
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: "1m"
        memory: "50Mi"
      limits:
        cpu: "2m"
        memory: "60Mi"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          resources:
            requests:
              storage: 10Gi
    externalUrl: "https://kronos.mywonderworks.tech/monitoring/alertmanager/"
    routePrefix: "/"
  route:
    main:
      enabled: true
      parentRefs:
        - name: kronos-gateway
          namespace: kube-system
          sectionName: https
      hostnames:
        - kronos.mywonderworks.tech
      matches:
        - path:
            type: PathPrefix
            value: /monitoring/alertmanager
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

grafana:
  persistence:
    enabled: true
    storageClassName: do-block-storage
    size: 10Gi
  resources:
    limits:
      cpu: "40m"
      memory: "256Mi"
    requests:
      cpu: "20m"
      memory: "160Mi"
  sidecar:
    resources:
      limits:
        cpu: "40m"
        memory: "160Mi"
      requests:
        cpu: "20m"
        memory: "96Mi"
  adminPassword: admin
  grafana.ini:
    server:
      root_url: "https://kronos.mywonderworks.tech/monitoring/grafana/"
      serve_from_sub_path: true
  route:
    main:
      enabled: true
      parentRefs:
        - name: kronos-gateway
          namespace: kube-system
          sectionName: https
      hostnames:
        - kronos.mywonderworks.tech
      matches:
        - path:
            type: PathPrefix
            value: /monitoring/grafana
